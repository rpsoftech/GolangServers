name: pm2go

# CI for servers/pm2go, Linux release binaries and the hub Docker image.
#
# PR / push to main touching pm2go: format, vet, race tests, Linux build, and
#   a build of the hub image with a smoke test (image is not pushed).
# Tag pm2go-v*: the same checks, then
#   - linux/amd64 and linux/arm64 binaries plus SHA256SUMS on a GitHub release
#   - multi-arch image ghcr.io/<owner>/pm2go-hub:<tag> and :latest
#
# Release by pushing a tag, for example: git tag pm2go-v0.1.0 && git push origin pm2go-v0.1.0

on:
  pull_request:
    paths:
      - "servers/pm2go/**"
      - "docs/knowledge-base/pm2go*"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/pm2go.yml"
  push:
    branches: [main]
    paths:
      - "servers/pm2go/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/pm2go.yml"
    tags:
      - "pm2go-v*"

concurrency:
  group: pm2go-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  IMAGE_NAME: pm2go-hub

jobs:
  test:
    name: format, vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l servers/pm2go)
          if [ -n "$out" ]; then
            echo "These files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./servers/pm2go/...

      - name: Test (race)
        run: go test -race -count=1 ./servers/pm2go/...

      - name: Build linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./servers/pm2go

  image:
    name: hub image (build and smoke test)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build context is the repository root; Dockerfile.dockerignore next to
      # the Dockerfile limits it to go.mod, go.sum and servers/pm2go.
      - name: Build (linux/amd64, loaded for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: servers/pm2go/deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: pm2go-hub:smoke
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=pm2go-hub
          cache-to: type=gha,scope=pm2go-hub,mode=max

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name hub -p 127.0.0.1:18080:8080 pm2go-hub:smoke
          ok=0
          for i in $(seq 1 30); do
            if [ "$(curl -s http://127.0.0.1:18080/healthz || true)" = "ok" ]; then ok=1; break; fi
            sleep 1
          done
          docker logs hub
          [ "$ok" = 1 ] || { echo "healthz never answered ok"; exit 1; }
          # First start must print the generated keys.
          docker logs hub 2>&1 | grep -q "admin password:"
          docker logs hub 2>&1 | grep -q "agent key:"
          # The image HEALTHCHECK must turn healthy.
          for i in $(seq 1 40); do
            s=$(docker inspect -f '{{.State.Health.Status}}' hub)
            [ "$s" = healthy ] && break
            sleep 2
          done
          echo "health status: $s"
          [ "$s" = healthy ]

      - name: Cleanup
        if: always()
        run: docker rm -f hub || true

  release:
    name: release binaries
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [test, image]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/rpsoftech/golang-servers/servers/pm2go/cli.Version=${TAG}" \
              -o dist/pm2go-linux-$arch ./servers/pm2go
          done
          (cd dist && sha256sum pm2go-linux-* > SHA256SUMS && cat SHA256SUMS)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pm2go-linux-amd64
            dist/pm2go-linux-arm64
            dist/SHA256SUMS
          generate_release_notes: true

  publish-image:
    name: publish hub image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [test, image]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        id: owner
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: servers/pm2go/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.name }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=pm2go-hub
          cache-to: type=gha,scope=pm2go-hub,mode=max
