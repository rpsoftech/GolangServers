name: CI

# Runs on every pull request and on main. builder.yml still builds all servers
# on push; this workflow is where tests live.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repo:
    name: repo (vet and test ./...)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Same system packages builder.yml installs for the GUI dependencies.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

  mysql-backup-exe:
    name: mysql-backup-exe (test, MySQL ${{ matrix.mysql }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Production servers include MySQL 5.x, so test the old versions too.
        mysql: ["5.5", "5.6", "5.7", "8.0"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-pw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect package
        id: pkg
        shell: bash
        run: |
          if [ -d servers/jwelly/mysql-backup-exe ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "mysql-backup-exe is not in this tree yet; skipping"
          fi

      - name: Vet
        if: steps.pkg.outputs.present == 'true'
        run: go vet ./servers/jwelly/mysql-backup-exe/...

      - name: Test
        if: steps.pkg.outputs.present == 'true'
        env:
          BACKUP_TEST_MYSQL_DSN: root:ci-root-pw@tcp(127.0.0.1:3306)/
        run: go test -race -count=1 -v ./servers/jwelly/mysql-backup-exe/...

  mysql-backup-exe-windows:
    name: mysql-backup-exe (windows build and test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect package
        id: pkg
        shell: bash
        run: |
          if [ -d servers/jwelly/mysql-backup-exe ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "mysql-backup-exe is not in this tree yet; skipping"
          fi

      - name: Vet
        if: steps.pkg.outputs.present == 'true'
        run: go vet ./servers/jwelly/mysql-backup-exe/...

      - name: Test (no database)
        if: steps.pkg.outputs.present == 'true'
        run: go test -count=1 ./servers/jwelly/mysql-backup-exe/...

      - name: Build exe
        if: steps.pkg.outputs.present == 'true'
        run: go build -o mysql-backup-exe.exe ./servers/jwelly/mysql-backup-exe/
